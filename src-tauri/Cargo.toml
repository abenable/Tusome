[package]
name = "tusome"
version = "1.1.1"
description = "Tusome — offline science learning for Uganda lower-secondary CBC"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tusome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
# Update channel core (docs/plan/07). All small pure-Rust crates so the
# installer stays <=20MB (docs/plan/08). `minisign-verify` is the zero-dep
# trust root for content-bundle manifest signatures; `sha2` does the
# deterministic per-pack directory hash; `zip` unpacks the online content
# channel's untrusted archive (the manifest signature inside is the trust
# root, not the archive). `sqlx` is pinned to 0.8 to match the version
# tauri-plugin-sql 2.4.0 compiles against, so we can reuse its managed
# connection pool from Rust (see append_update_log / get_update_log) —
# it is already in the dep tree transitively, so this adds no new compile.
minisign-verify = "0.2.5"
sha2 = "0.10"
zip = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Lab mode (src/lab.rs): ChaCha20-Poly1305 + PBKDF2 for LAN traffic. Already
# in the tree via rustls, so no new crate is downloaded or compiled.
ring = "0.17"

# `tokio` (timer only) lets the startup USB scan wait for the DB pool; already
# in the tree via tauri.
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"
# The online content channel downloads its bundle in Rust (a webview fetch of
# a GitHub release asset is blocked by CORS). Same reqwest + rustls/ring build
# the updater already compiles, so no new TLS stack lands in the installer.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
# Test-only signing: `minisign` mints an in-memory keypair so unit tests
# produce valid minisign signatures WITHOUT any on-disk private key. The prod
# verify path (`minisign-verify`) never depends on this. `tempfile` gives the
# tests throwaway content dirs and bundle roots.
minisign = "0.9.1"
tempfile = "3"
# examples/make_bundle.rs decodes Tauri's base64-wrapped signing key.
base64 = "0.22"
# Async tests for the lab server's query runner (src/lab.rs).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

