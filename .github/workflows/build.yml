name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc

      - name: Unit tests
        run: bun test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        # Linux: .deb only (AppImage bundles the runtime and blows the 20MB
        # budget; the primary distribution channel is the .deb / manual USB).
        # Windows: default (msi + nsis). tauri.conf.json's updater plugin makes
        # the build sign when TAURI_SIGNING_PRIVATE_KEY is set (repo secret);
        # if unset the installer is unsigned and the updater latest.json is
        # skipped — manual USB distribution still works.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            bun tauri build --bundles deb
          else
            bun tauri build
          fi

      - name: Enforce installer size budget (20MB)
        shell: bash
        run: |
          set -euo pipefail
          BUDGET=$((20 * 1024 * 1024))
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "Bundle directory: $BUNDLE_DIR"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "ERROR: bundle directory not found: $BUNDLE_DIR"
            exit 1
          fi
          max=0
          max_file=""
          # Measure only the distributable installers (.deb/.msi/.exe/.AppImage/.rpm),
          # NOT the unpacked staging trees (e.g. the raw `usr/bin/cbclab` binary
          # inside the deb dir, which is ~22 MB but compresses into the 17 MB .deb
          # the user actually downloads). The budget is on what ships.
          while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$size bytes  $f"
            if [ "$size" -gt "$max" ]; then
              max=$size
              max_file="$f"
            fi
          done < <(find "$BUNDLE_DIR" -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o \
            -name '*.msi' -o -name '*.exe' \) -print0)
          budget_mb=$((BUDGET / 1024 / 1024))
          max_mb=$((max / 1024 / 1024))
          echo "----"
          echo "Largest bundle file: $max bytes (~${max_mb} MB) -> $max_file"
          echo "Budget: $BUDGET bytes (~${budget_mb} MB)"
          if [ "$max" -gt "$BUDGET" ]; then
            echo "FAIL: largest bundle file exceeds the ${budget_mb}MB installer budget"
            exit 1
          fi
          echo "OK: within budget"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: cbclab-bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # Publish a GitHub Release with every built installer when a v* tag is pushed.
  # Push a tag like `git tag v0.1.0 && git push origin v0.1.0` to cut a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers + updater manifest
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o \
            -name '*.msi' -o -name '*.exe' -o \
            -name '*.json' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "release-assets/$(basename "$f")"
            done
          echo "=== release assets ==="
          ls -la release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" --generate-notes
