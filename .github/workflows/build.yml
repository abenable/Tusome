name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc

      - name: Unit tests
        run: bun test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        # Linux: .deb only (the primary distribution channel is the .deb / USB).
        # Windows: default (msi + nsis). tauri.conf.json's updater plugin makes
        # the build sign when TAURI_SIGNING_PRIVATE_KEY is set (repo secret);
        # if unset the installer is unsigned and the updater latest.json is
        # skipped — manual USB distribution still works.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            bun tauri build --bundles deb
          else
            bun tauri build
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: cbclab-bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # Publish a GitHub Release with every built installer when a v* tag is pushed.
  # Push a tag like `git tag v0.1.0 && git push origin v0.1.0` to cut a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect installers + updater manifest
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o \
            -name '*.msi' -o -name '*.exe' -o \
            -name '*.json' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "release-assets/$(basename "$f")"
            done
          echo "=== release assets ==="
          ls -la release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" --generate-notes
