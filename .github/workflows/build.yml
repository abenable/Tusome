name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc

      - name: Unit tests
        run: bun test

      - name: Validate content packs
        run: bun run validate:content

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        # Linux: .deb only. Windows: msi + nsis. With the signing key set as
        # repo secrets, each installer also gets a minisign .sig for the
        # in-app updater (createUpdaterArtifacts); without it the build still
        # succeeds, but installed copies can't update online from it.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [ "$RUNNER_OS" = "Linux" ]; then args+=(--bundles deb); fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::No signing key secret: installers won't update online"
          fi
          bun tauri build "${args[@]}"

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: tusome-bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # Publish a GitHub Release with every built installer when a v* tag is pushed.
  # Push a tag like `git tag v0.1.0 && git push origin v0.1.0` to cut a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Collect installers + updater manifest
        # Installers and their .sig files only (the bundle folder also holds
        # bundled content JSON, which doesn't belong on the release page).
        # latest.json is what installed copies poll; it's only written when
        # the installers were signed.
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.deb' -o -name '*.deb.sig' -o \
            -name '*.msi' -o -name '*.msi.sig' -o \
            -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "release-assets/$(basename "$f")"
            done
          if ls release-assets/*.sig >/dev/null 2>&1; then
            bun scripts/updater-json.ts release-assets "$GITHUB_REF_NAME"
          else
            echo "::warning::Unsigned release: no latest.json, so no online updates"
          fi
          echo "=== release assets ==="
          ls -la release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" --generate-notes
